services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: criptotrabalhofinal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "11433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s 

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: criptotrabalhofinal-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CriptoTrabalhoFinalInfraestrutura;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True"
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
